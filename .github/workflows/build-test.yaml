name: build-test
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'

env:
  DOTNET_VERSION: '10.*.*'

jobs:
  build-dotnet:
    runs-on: self-hosted
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6  
        with:
          clean: true
      - name: Restore Solution
        run: dotnet restore
      - name: Build Debug Solution
        run: dotnet build -c Release --no-restore
      - name: Test Solution
        run: dotnet test --no-restore --verbosity normal
      - name: Publish & Deploy Solution
        run: dotnet publish -c Release -o /var/www/MovieCatalogue/
      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Run EF Core migrations
        env:
          ConnectionStrings__MovieAppContext: "Server=127.0.0.1,1433;Database=MovieApp;User Id=sa;Password=${{ secrets.SQL_SA_PASSWORD }};TrustServerCertificate=True;"
        working-directory: MovieApp.Web
        run: |
          # Ensure dotnet-ef is available
          dotnet ef database update -c Release --no-build --project . --startup-project .
