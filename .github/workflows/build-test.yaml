name: build-test
on:
  workflow_call:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6  
        with:
          clean: true
      - name: Restore Solution
        run: dotnet restore
      - name: Build Solution
        run: dotnet build -c Release --no-restore
      - name: Test Solution
        run: dotnet test --no-restore --verbosity normal -c Release
      - name: Verify nginx
        run: sudo nginx -t -c "$GITHUB_WORKSPACE/deploy/ubuntu/nginx/config.conf"
      - name: Verify Scripts
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done