name: build-test
on:
  workflow_call:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.razor*'

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6  
        with:
          clean: true
      - name: Restore Solution
        run: dotnet restore
      - name: Build Solution
        run: dotnet build -c Release --no-restore
      - name: Test Solution
        run: dotnet test --no-restore --verbosity normal -c Release
        # this wraps the config in a similar way to the deployed version (prevents having to deploy to validate)
      - name: Verify nginx
        run: |
          cat <<EOF > /tmp/nginx-test.conf
          events {}
          http {
              include $GITHUB_WORKSPACE/deploy/ubuntu/nginx/config.conf;
          }
          EOF
          sudo nginx -t -c /tmp/nginx-test.conf
      - name: Verify Scripts
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

  # Manual gate: this job waits until a reviewer approves the "OnPremise-PR"
  # environment in GitHub. Reject (or ignore) it and nothing is deployed.
  # Only runs for pull requests; the push-to-main flow has its own deploy job.
  deploy-pr:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy')
    needs: build-test
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: OnPremise
    secrets: inherit
